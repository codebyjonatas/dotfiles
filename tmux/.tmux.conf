# ~/.tmux.conf

# --- Geral / Qualidade de Vida ---

# Define o prefixo para C-a (mais ergonômico que C-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Define zsh como o shell padrão
set-option -g default-shell /bin/zsh

# Aumenta o histórico de scroll
set-option -g history-limit 10000

# Indexação de janelas e painéis a partir de 1 (mais fácil de acessar com o teclado)
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Remove o delay ao pressionar a tecla ESC (essencial para Neovim)
set-option -s escape-time 0

# Foca automaticamente em uma janela ao criá-la ou movê-la
set-option -g focus-events on

# Habilita o suporte ao mouse (clicar em janelas, painéis e redimensionar)
set-option -g mouse on

# --- Atalhos (Keybindings) ---

# Recarrega a configuração do tmux com Prefixo + r
bind r source-file ~/.tmux.conf \; display "Configuração recarregada!"
# C-a + I para atualizar os plugins

# Divisão de painéis mais intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegação entre painéis no estilo Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Criação e Navegação de Janelas (Tabs)
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind -r C-h select-window -t :-1
bind -r C-l select-window -t :+1

# Redimensionamento de painéis no estilo Vim
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Modo de Cópia (Estilo Vim) ---

# Ativa o modo de cópia com as teclas do vi
set-window-option -g mode-keys vi

# Atalhos para seleção e cópia no modo de cópia
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Visuais e Tema ---

# Suporte a True Color (para temas do Neovim no Ghostty)
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Posição da status bar (top ou bottom)
set-option -g status-position top



# --- Gerenciador de Plugins (TPM) ---
# https://github.com/tmux-plugins/tpm

# Lista de plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # Configurações sensatas como padrão
set -g @plugin 'tmux-plugins/tmux-resurrect' # Persiste sessões tmux entre reinicializações do sistema
set -g @plugin 'tmux-plugins/tmux-continuum' # Salva e restaura automaticamente
set -g @plugin 'tmux-plugins/tmux-yank' # Copia para a área de transferência do sistema
# set -g @plugin 'catppuccin/tmux' # Tema Catppuccin
set -g @plugin '2kabhishek/tmux2k' # Adiciona o tema tmux2k
set -g @catppuccin_flavour 'macchiato' # mocha, macchiato, frappe, latte

# --- Configuração do tmux2k ---
set -g @tmux2k-theme 'catppuccin'

# Para adicionar o git ao status bar basta adicionar o *git dentro da string que contêm os outros
# plugins. Ex: "session git cpu ram"
set -g @tmux2k-left-plugins "session git cpu ram" # Removidos: git

# Para adicionar o time ao status bar basta adicionar o *time dentro da string que contêm os outros
# plugins. Ex: "battery network time"
set -g @tmux2k-right-plugins "battery network time" # Removidos: time

# Inicializa o TPM (mantenha esta linha no final do arquivo)
run '~/.tmux/plugins/tpm/tpm'
