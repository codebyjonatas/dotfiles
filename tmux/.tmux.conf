# ~/.tmux.conf

# --- Geral / Qualidade de Vida ---

# Define o prefixo para C-a (mais ergonômico que C-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Define fish como o shell padrão
set-option -g default-shell /usr/bin/fish

# Aumenta o histórico de scroll
set-option -g history-limit 10000

# Indexação de janelas e painéis a partir de 1
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Remove o delay ao pressionar a tecla ESC (essencial para Neovim)
set-option -s escape-time 0

# Foca automaticamente em uma janela ao criá-la ou movê-la
set-option -g focus-events on

# Habilita o suporte ao mouse
set-option -g mouse on

# Permitir o envio de sequências de escape ANSI diretamente para o emulador de terminal externo 
set-option -g allow-passthrough on

# Informa ao Tmux para encapsular as sequências de escape corretamente
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# --- Atalhos (Keybindings) ---

# Recarrega a configuração do tmux
bind r source-file ~/.tmux.conf \; display "Configuração recarregada!"

# Dica: Use Prefixo + I (I maiúsculo) para instalar os plugins do TPM

# Divisão de painéis mais intuitiva
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegação entre painéis no estilo Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Criação e Navegação de Janelas
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind -r C-h select-window -t :-1
bind -r C-l select-window -t :+1

# Redimensionamento de painéis
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Modo de Cópia (Estilo Vim) ---
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Visuais e Tema ---
set-option -g default-terminal "tmux-256color"

# Suporte a cores reais e sequências de escape estendidas para o Ghostty
set-option -as terminal-overrides ',ghostty*:Tbc:Tc'
set-option -as terminal-overrides ',xterm*:Tc'
set-option -g status-position top

# --- Gerenciador de Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin '2kabhishek/tmux2k'

# --- Configuração do tmux2k ---
set -g @tmux2k-theme 'gruvbox'
set -g @tmux2k-left-plugins "session git cpu ram"
set -g @tmux2k-right-plugins "battery network time"

# Inicializa o TPM (Mantenha sempre no final)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# Added by Gemini to fix Hyprland integration
set-option -g update-environment ' DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE'

# --- Clipboard do sistema (Wayland) ---
# Sobrescreve os defaults do tmux que só copiam para o buffer interno
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi M-w send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi C-w send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H; send-keys -X select-word; run-shell -d 0.3; send-keys -X copy-pipe-and-cancel "wl-copy" }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H; send-keys -X select-line; run-shell -d 0.3; send-keys -X copy-pipe-and-cancel "wl-copy" }
